<h1>帮助与支持</h1>
<h2>联系我们</h2><p>遇到问题或有建议，请发邮件至 <a href="mailto:asa24@qq.com">asa24@qq.com</a>，我们通常在 2 个工作日内回复。</p>
<h2>常见问题</h2>
<p><b>进度存在哪里？</b> 所有学习记录和宠物数据都保存在你的手机本地，不上传服务器。删除 App 会清除数据。</p>
<p><b>英文发音怎么更自然？</b> 到 iPhone「设置 → 辅助功能 → 朗读内容 → 声音 → 英语」下载带「增强」的声音，再到小窝单词的「设置 → 英文发音」里选择它。</p>
<p><b>怎么换词库？</b> 在「背单词」页点当前词库名称即可切换，各词库进度分别保存。</p>
<p><b>App 需要联网吗？</b> 不需要，所有功能离线可用。</p>
